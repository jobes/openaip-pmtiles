name: Email PMTiles problems

on:
  # Manually send a clearly labelled test email using the same Gmail secrets.
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate PMTiles"]
    branches: [main]
    types: [completed]

# Email delivery needs no GitHub API access or repository checkout.
permissions: {}

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send problem notification through Gmail
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: python
        run: |
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          is_test = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          if is_test:
              run = {
                  "name": os.environ["GITHUB_WORKFLOW"],
                  "conclusion": "test",
                  "run_number": os.environ["GITHUB_RUN_NUMBER"],
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "head_branch": os.environ["GITHUB_REF_NAME"],
                  "event": "workflow_dispatch",
                  "html_url": (
                      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  ),
              }
          else:
              run = event["workflow_run"]
          conclusion = run["conclusion"]

          # Also enforce the filter here, before reading credentials or connecting.
          if not is_test and conclusion not in {"failure", "cancelled"}:
              print("No problem notification needed.")
              raise SystemExit(0)

          address = os.environ.get("GMAIL_ADDRESS", "").strip()
          password = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "").strip()
          if not address or not password:
              raise SystemExit(
                  "Configure the GMAIL_ADDRESS and GMAIL_APP_PASSWORD repository secrets. "
                  "See docs/email-notifications.md."
              )

          repository = event["repository"]["full_name"]
          attempt = run["run_attempt"]
          message = EmailMessage()
          message["From"] = address
          message["To"] = address
          message["Date"] = formatdate(localtime=False)
          message["Message-ID"] = make_msgid()
          message["Subject"] = (
              f"{'[TEST] ' if is_test else ''}[{repository}] {run['name']}: {conclusion} "
              f"(run #{run['run_number']}, attempt {attempt})"
          )
          message.set_content(
              f"Workflow: {run['name']}\n"
              f"Result: {conclusion}\n"
              f"Repository: {repository}\n"
              f"Branch: {run['head_branch']}\n"
              f"Trigger: {run['event']}\n"
              f"Run: #{run['run_number']}, attempt {attempt}\n\n"
              f"Open the run and logs:\n{run['html_url']}/attempts/{attempt}\n\n"
              + (
                  "This is a manually requested test email. Gmail authentication and SMTP sending worked.\n"
                  if is_test else
                  "This email is sent only for failure or cancellation.\n"
              )
          )

          with smtplib.SMTP_SSL(
              "smtp.gmail.com", 465, context=ssl.create_default_context(), timeout=30
          ) as smtp:
              smtp.login(address, password)
              smtp.send_message(message)
          print("Problem notification sent.")
