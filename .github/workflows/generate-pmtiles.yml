name: Generate PMTiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-tiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely pyproj huggingface_hub google-auth

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Set these two secrets in the repo settings (see readme).
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate PMTiles
        env:
          PYTHONUNBUFFERED: "1"
          # Billing project charged for the requester-pays bucket downloads.
          GCS_USER_PROJECT: ${{ secrets.GCS_USER_PROJECT }}
        run: python main.py

      - name: Upload PMTiles artifact
        if: hashFiles('openaip.pmtiles') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pmtiles-outputs
          path: openaip.pmtiles

      - name: Update Generated Date in Webpage
        run: python update_web.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  upload-to-hugging-face:
    needs: build-tiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely pyproj huggingface_hub

      - name: Download PMTiles artifact
        uses: actions/download-artifact@v4
        with:
          name: pmtiles-outputs
          path: .

      - name: Upload to Hugging Face
        if: hashFiles('openaip.pmtiles') != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python upload_to_hugging_face.py

  deploy-pages:
    needs: upload-to-hugging-face
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
