name: Generate PMTiles

on:
  workflow_dispatch:
  schedule:
    # Once a week, Sunday 04:00 UTC — early morning on a weekend,
    # when GitHub Actions runners are least busy.
    - cron: "0 4 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.layers.outputs.names }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install requests shapely pyproj

      - name: List layers
        id: layers
        run: echo "names=$(python main.py list-layers)" >> "$GITHUB_OUTPUT"

      - name: Download OpenAIP exports
        run: python -u main.py download

      - name: Upload source exports
        uses: actions/upload-artifact@v4
        with:
          name: openaip-exports
          path: tmp/
          if-no-files-found: error
          overwrite: true

  build-layer:
    needs: download
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.download.outputs.layers) }}
    env:
      LAYER: ${{ matrix.layer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install requests shapely pyproj

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Download source exports
        uses: actions/download-artifact@v4
        with:
          name: openaip-exports
          path: tmp

      - name: Prepare layer GeoJSON
        run: python -u main.py prepare-layer "$LAYER"

      - name: Generate layer tiles
        run: python -u main.py build-layer "$LAYER"

      - name: Upload layer tiles
        if: hashFiles(format('tmp/{0}.mbtiles', matrix.layer)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: tiles-${{ matrix.layer }}
          path: tmp/${{ matrix.layer }}.mbtiles
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  build-tiles:
    needs: build-layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Download layer tiles
        uses: actions/download-artifact@v4
        with:
          pattern: tiles-*
          merge-multiple: true
          path: tmp/layers

      - name: Merge and check PMTiles
        run: |
          tile-join --no-tile-size-limit --quiet --name openaip -o openaip.pmtiles tmp/layers/*.mbtiles
          tippecanoe-decode openaip.pmtiles 0 0 0 > /dev/null

      - name: Upload PMTiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmtiles-outputs
          path: openaip.pmtiles
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      - name: Update Generated Date in Webpage
        run: python update_web.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  upload-to-hugging-face:
    needs: build-tiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install huggingface_hub

      - name: Download PMTiles artifact
        uses: actions/download-artifact@v4
        with:
          name: pmtiles-outputs
          path: .

      - name: Download source exports
        uses: actions/download-artifact@v4
        with:
          name: openaip-exports
          path: tmp

      - name: Generate allairports.json
        run: python generate_airport_index.py

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -s notam-areas.json
          python upload_to_hugging_face.py

  deploy-pages:
    needs: upload-to-hugging-face
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
