name: Generate PMTiles

on:
  workflow_dispatch:
  schedule:
    # Once a week, Sunday 04:00 UTC — early morning on a weekend,
    # when GitHub Actions runners are least busy.
    - cron: "0 4 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.layers.outputs.names }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install requests shapely pyproj

      - name: List layers
        id: layers
        run: echo "names=$(python main.py list-layers)" >> "$GITHUB_OUTPUT"

      - name: Download OpenAIP exports
        run: python -u main.py download

      - name: Upload source exports
        uses: actions/upload-artifact@v6
        with:
          name: openaip-exports
          path: tmp/
          if-no-files-found: error
          overwrite: true

  prepare-layer:
    needs: download
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.download.outputs.layers) }}
    env:
      LAYER: ${{ matrix.layer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install requests shapely pyproj

      - name: Download source exports
        uses: actions/download-artifact@v7
        with:
          name: openaip-exports
          path: tmp

      - name: Prepare line-delimited GeoJSON
        run: python -u main.py prepare-layer "$LAYER"

      - name: Upload prepared GeoJSON
        uses: actions/upload-artifact@v6
        with:
          name: prepared-${{ matrix.layer }}
          path: tmp/${{ matrix.layer }}.geojson
          if-no-files-found: error
          overwrite: true

  build-tiles:
    needs: prepare-layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install requests shapely pyproj

      - name: Install Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
          tippecanoe --version

      - name: Download prepared GeoJSON
        uses: actions/download-artifact@v7
        with:
          pattern: prepared-*
          merge-multiple: true
          path: tmp

      - name: Build and check PMTiles
        run: |
          python -u main.py build-tiles
          tippecanoe-decode openaip.pmtiles 0 0 0 > /dev/null

      - name: Upload PMTiles artifact
        uses: actions/upload-artifact@v6
        with:
          name: pmtiles-outputs
          path: openaip.pmtiles
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      - name: Update Generated Date in Webpage
        run: python update_web.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web

  upload-to-hugging-face:
    needs: build-tiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install huggingface_hub shapely

      - name: Download PMTiles artifact
        uses: actions/download-artifact@v7
        with:
          name: pmtiles-outputs
          path: .

      - name: Download source exports
        uses: actions/download-artifact@v7
        with:
          name: openaip-exports
          path: tmp

      - name: Generate airports.geojson
        run: python generate_airport_index.py

      - name: Generate notam-areas.json
        run: python generate_notam_areas.py

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python upload_to_hugging_face.py

  deploy-pages:
    needs: upload-to-hugging-face
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
