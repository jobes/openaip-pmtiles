name: Check Bucket

# Manual trigger only — run the bucket audit on demand from the Actions tab
# ("Run workflow"). The script lists every *.geojson file in the source bucket
# and reports which ones the export pipeline expects vs. which are missing.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit-bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely pyproj google-auth

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Same secrets used by the generate-pmtiles.yml workflow (see readme).
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Audit bucket GeoJSON files
        env:
          PYTHONUNBUFFERED: "1"
          # Billing project charged for the requester-pays bucket listing.
          GCS_USER_PROJECT: ${{ secrets.GCS_USER_PROJECT }}
        run: python check_bucket.py
